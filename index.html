<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mitgliederprüfung</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 24px auto; padding: 0 16px; color: #222; background: #fafafa; }
  h1 { font-size: 1.4rem; }
  section { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  h2 { font-size: 1.05rem; margin-top: 0; }
  label { display: block; margin: 10px 0 4px; font-size: .9rem; }
  input[type=text], input[type=date] { width: 100%; box-sizing: border-box; padding: 8px; font-size: 1rem; border: 1px solid #bbb; border-radius: 6px; }
  button { margin-top: 12px; margin-right: 8px; padding: 9px 16px; font-size: 1rem; border: 0; border-radius: 6px; background: #2457c5; color: #fff; cursor: pointer; }
  button.secondary { background: #e4e7ee; color: #222; }
  .msg { margin-top: 12px; font-weight: 600; }
  .ok { color: #1a7f37; } .bad { color: #b42318; } .info { color: #555; font-weight: normal; font-size: .9rem; }
</style>
</head>
<body>

<section>
  <h2>Mitglied prüfen</h2>
  <label for="cn">Name</label><input type="text" id="cn" autocomplete="off">
  <label for="cb">Geburtsdatum</label><input type="date" id="cb">
  <button onclick="check()">Prüfen</button>
  <div class="msg" id="cres"></div>
</section>

<script>
// Muss identisch zur Version sein, mit der die Hashes erzeugt wurden!
const SALT = new TextEncoder().encode("verein-mitgliederpruefung-v1");
const ITER = 600000;
const HASH_FILE = "mitglieder_hashes.txt"; // liegt im selben Ordner wie diese Datei
const $ = id => document.getElementById(id);

let hashes = new Set();

function normName(s) { return s.normalize("NFC").trim().split(/\s+/).join(" ").toLowerCase(); }

function normDate(s) {
  s = s.trim(); let m;
  if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/))) return valid(m[1], m[2], m[3]);
  if ((m = s.match(/^(\d{1,2})[./](\d{1,2})[./](\d{4})$/))) return valid(m[3], m[2], m[1]);
  throw new Error("Ungültiges Datum: " + s);
}
function valid(y, mo, d) {
  const dt = new Date(Date.UTC(+y, +mo - 1, +d));
  if (dt.getUTCFullYear() != +y || dt.getUTCMonth() != +mo - 1 || dt.getUTCDate() != +d)
    throw new Error("Ungültiges Datum: " + d + "." + mo + "." + y);
  return `${y}-${String(mo).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
}

async function makeHash(name, date) {
  if (!name.trim()) throw new Error("Bitte einen Namen eingeben.");
  const payload = new TextEncoder().encode(normName(name) + "|" + normDate(date));
  const key = await crypto.subtle.importKey("raw", payload, "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt: SALT, iterations: ITER, hash: "SHA-256" }, key, 256);
  return [...new Uint8Array(bits)].map(b => b.toString(16).padStart(2, "0")).join("");
}

function show(id, text, ok) { const e = $(id); e.textContent = text; e.className = "msg " + (ok ? "ok" : "bad"); }

async function loadList() {
  try {
    const res = await fetch(HASH_FILE, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const text = await res.text();
    hashes = new Set(text.split("\n").map(l => l.trim()).filter(Boolean));
    $("count").textContent = hashes.size + " Mitglieder geladen (" + HASH_FILE + ")";
  } catch (e) {
    $("count").textContent = HASH_FILE + " konnte nicht automatisch geladen werden. Bitte Datei manuell auswählen.";
    $("count").className = "msg bad";
    $("fallback").style.display = "";
  }
}

async function check() {
  try {
    if (!hashes.size) return show("cres", "Keine Hash-Liste geladen.", false);
    const h = await makeHash($("cn").value, $("cb").value);
    hashes.has(h) ? show("cres", "✔ Mitglied bestätigt", true) : show("cres", "✘ Kein Mitglied mit diesen Angaben gefunden", false);
  } catch (e) { show("cres", e.message, false); }
}

$("file").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    hashes = new Set(r.result.split("\n").map(l => l.trim()).filter(Boolean));
    $("count").textContent = hashes.size + " Mitglieder geladen (" + f.name + ")";
    $("count").className = "msg info";
  };
  r.readAsText(f);
});

loadList();
</script>
</body>
</html>
